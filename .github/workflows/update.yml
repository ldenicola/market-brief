name: Update Market Brief

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes (GitHub may start runs a few minutes late)
  workflow_dispatch:          # lets you run it by hand from the Actions tab
    inputs:
      briefing:
        description: "Generate a fresh daily briefing now"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch quotes, headlines and briefing
        run: python fetch_data.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FORCE_BRIEFING: ${{ inputs.briefing }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4

